stages:
  - deploy

deploy:
  stage: deploy
  only:
    - main
  tags:
    - shared
  script:
    - docker --version
    - docker compose version
    - test -n "$DB_PASSWORD"
    - test -n "$JWT_KEY"
    - test -f docker-compose.yml
    - test -f WebApp/Dockerfile
    - test -f src/ClientApp/Dockerfile
    - docker compose -f docker-compose.yml -p beautybook config
    - docker compose -f docker-compose.yml -p beautybook pull db
    - docker compose -f docker-compose.yml -p beautybook build --no-cache --progress=plain
    - docker compose -f docker-compose.yml -p beautybook up --remove-orphans --detach