stages:
  - build
  - deploy

vue-client-build:
  stage: build
  image: node:22-alpine
  tags:
    - shared
  only:
    - main
  cache:
    key: vue-client-$CI_COMMIT_REF_SLUG
    paths:
      - vue-client/node_modules/
  script:
    - cd vue-client
    - npm ci
    - npm run type-check
    - npm run build
  artifacts:
    paths:
      - vue-client/dist/
    expire_in: 1 hour

deploy:
  stage: deploy
  only:
    - main
  tags:
    - shared
  script:
    - docker --version
    - docker compose version
    - test -n "$DB_PASSWORD"
    - test -n "$JWT_KEY"
    - test -f docker-compose.yml
    - test -f WebApp/Dockerfile
    - test -f src/ClientApp/Dockerfile
    - docker compose -f docker-compose.yml config
    - docker compose -f docker-compose.yml -p beautybook pull db
    - docker compose -f docker-compose.yml -p beautybook build --no-cache --progress=plain 2>&1
    - docker compose -f docker-compose.yml -p beautybook up --remove-orphans --detach || (docker compose -f docker-compose.yml -p beautybook logs --tail=200 db backend client-app && false)
