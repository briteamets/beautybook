services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: beautybook
      POSTGRES_USER: beautybook
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beautybook -d beautybook"]
      interval: 5s
      timeout: 5s
      retries: 30

  webapp:
    build:
      context: .
      dockerfile: WebApp/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=beautybook;Username=beautybook;Password=${DB_PASSWORD:?DB_PASSWORD is required}
      JWT__Key: ${JWT_KEY:?JWT_KEY is required}
      JWT__Issuer: beautybook-api
      JWT__Audience: beautybook-client
      JWT__ExpiresInSeconds: 3600
      DataInitialization__MigrateDatabase: "true"
      DataInitialization__SeedIdentity: "true"
      DataInitialization__SeedData: "true"
      Cors__ClientOrigins__0: http://localhost:8081
      Cors__ClientOrigins__1: http://localhost:8082
    ports:
      - "82:8080"

  clientapp:
    build:
      context: .
      dockerfile: src/ClientApp/Dockerfile
    restart: unless-stopped
    depends_on:
      - webapp
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ApiBaseUrl: http://webapp:8080/
      TZ: Europe/Tallinn
    ports:
      - "8081:8080"

  vue-client:
    build:
      context: ./vue-client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - webapp
    ports:
      - "8082:80"

volumes:
  pgdata: